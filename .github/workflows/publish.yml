name: publish

# Publish a klassy build into the shared apt repo (ansible-autobott/debian-repo).
# Git-tag driven: `make tag RELEASE=<r>` pushes a tag like debian_sid-v6.7.2 and
# this workflow picks it up. klassy-deb has no version of its own — the release IS
# the klassy version pinned as REF_<release> in releases.mk. One-time setup (the
# DEBIAN_REPO_TOKEN secret) is described in the README.
on:
  push:
    tags: ['*-v*']              # e.g. debian_sid-v6.7.2 (pushed by `make tag`)
  workflow_dispatch:
    inputs:
      release:
        description: Debian release key from releases.mk (e.g. debian_sid)
        default: debian13_trixie

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # create the release / upload the .deb asset
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout klassy-deb
        uses: actions/checkout@v4

      - name: Resolve release + tag
        id: r
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            release="${GITHUB_REF_NAME%-v*}"      # debian_sid-v6.7.2 -> debian_sid
            tag="$GITHUB_REF_NAME"
          else
            release="${{ inputs.release }}"
            tag="$release-$(make -s print-ref RELEASE="$release")"
          fi
          # The Debian codename, not the release key, is what the apt repo keys on
          # (dist/ subdir, `release` field, package filename). Resolve it from
          # releases.mk and fail loudly on an unknown key — a bogus tag would
          # otherwise register an empty release and break debian-repo's publish.
          codename="$(make -s print-codename RELEASE="$release")"
          [ -n "$codename" ] || { echo "::error::no CODENAME_$release in releases.mk"; exit 1; }
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "codename=$codename" >> "$GITHUB_OUTPUT"

      - name: Build the .deb
        run: make ci-build RELEASE="${{ steps.r.outputs.release }}"

      - name: Attach the .deb to a GitHub release
        run: |
          tag='${{ steps.r.outputs.tag }}'
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" "dist/${{ steps.r.outputs.codename }}"/*.deb --clobber

      # Registers a package reference in debian-repo (per-arch URL + sha256) and
      # pushes it, triggering a publish there.
      #
      # `dist-dir: dist` (not dist/<codename>) is deliberate: register reads each
      # SUBDIRECTORY name as the target release, so dist/sid/*.deb registers for
      # sid alone. A flat dist-dir would register as `any` and place this build
      # into every suite.
      #
      # `file` gives each codename its own package file. A package file holds one
      # version, and klassy ships different versions per suite (trixie gets v6.5.3
      # — see releases.mk), so a shared packages/klassy.json would mean each tag
      # clobbered the previous suite's entry. Separate files also keep the suites
      # independent: publishing sid never rewrites trixie's entry.
      #
      # TODO: re-pin to @v1 once debian-repo tags a v1 (it has no tags yet).
      - name: Register with ansible-autobott/debian-repo
        uses: ansible-autobott/debian-repo/.github/actions/register@main
        with:
          name: klassy                       # must match the .deb Package field
          dist-dir: dist
          file: packages/klassy.${{ steps.r.outputs.codename }}.json
          tag: ${{ steps.r.outputs.tag }}
          token: ${{ secrets.DEBIAN_REPO_TOKEN }}
